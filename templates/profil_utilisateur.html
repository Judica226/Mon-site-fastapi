<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - {{ utilisateur.proprietaire }}</title>
    <style>
        :root {
            --bg-dark: #121212;
            --surface-dark: #1e1e1e;
            --surface-light: #2c2c2c;
            --coris-red: #c8102e;
            --coris-dark-red: #8b0000;
            --coris-gold: #f2a900;
            --active-blue: #0084ff;
            --online-green: #31a24c;
            --text-primary: #ffffff;
            --text-secondary: #b0b3b8;
            --border-color: #333333;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            padding-top: 65px;
            padding-bottom: 30px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Barre de navigation fixe */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: var(--surface-dark);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
            max-width: 480px;
            margin: 0 auto;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border-radius: 50%;
            text-decoration: none;
            transition: background-color 0.2s, color 0.2s;
        }

        .nav-btn:hover, .nav-btn:active {
            background-color: var(--surface-light);
            color: var(--text-primary);
        }

        /* Carte En-tête du Profil */
        .profile-card {
            background-color: var(--surface-dark);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: var(--shadow);
            position: relative;
        }

        .avatar-container {
            position: relative;
            margin-bottom: 14px;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: var(--surface-light);
            border: 3px solid var(--coris-red);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(200, 16, 46, 0.3);
        }

        .status-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 18px;
            height: 18px;
            background-color: var(--online-green);
            border: 3px solid var(--surface-dark);
            border-radius: 50%;
        }

        .profile-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .profile-id {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .online-status-text {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: var(--online-green);
            font-weight: 500;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background-color: var(--online-green);
            border-radius: 50%;
        }

        /* Grille des boutons d'action */
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
        }

        .action-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 16px;
            background-color: var(--surface-dark);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .action-link:hover {
            background-color: var(--surface-light);
            border-color: var(--coris-red);
            transform: translateY(-2px);
        }

        .action-link:active {
            transform: translateY(0);
        }

        .action-link.primary {
            background-color: var(--active-blue);
            border-color: var(--active-blue);
            color: #ffffff;
        }

        .action-link.primary:hover {
            background-color: #006bce;
            border-color: #006bce;
        }

        .action-link.full-width {
            grid-column: span 2;
            background-color: var(--surface-light);
        }

        .action-link.full-width:hover {
            background-color: #3a3a3a;
        }

        /* Cartes d'informations & Publications */
        .section-card {
            background-color: var(--surface-dark);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .section-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .info-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .info-label {
            color: var(--text-secondary);
        }

        .info-value {
            font-weight: 600;
            color: var(--text-primary);
        }

        .empty-publications {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            padding: 24px 12px;
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            background-color: rgba(255, 255, 255, 0.02);
        }
    </style>
</head>
<body>

    <!-- Barre de navigation supérieure -->
    <header class="top-bar">
        <div class="nav-links">
            <a href="/home" class="nav-btn" title="Accueil">🏠</a>
            <a href="/messages" class="nav-btn" title="Messagerie">💬</a>
            <a href="/users" class="nav-btn" title="Utilisateurs">👥</a>
        </div>
        <a href="/home" class="nav-btn" title="Retour Accueil">🔙</a>
    </header>

    <!-- Conteneur principal -->
    <div class="app-container">

        <!-- Carte En-tête Profil -->
        <section class="profile-card">
            <div class="avatar-container">
                <div class="profile-avatar">
                    <svg width="55" height="55" viewBox="0 0 24 24" fill="none" stroke="#b0b3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <div class="status-badge" title="En ligne"></div>
            </div>

            <h1 class="profile-name">{{ utilisateur.proprietaire }}</h1>
            <span class="profile-id">ID Utilisateur : #{{ utilisateur.id }}</span>

            <div class="online-status-text">
                <span class="online-dot"></span>
                <span>En ligne</span>
            </div>
        </section>

        <!-- Boutons d'action -->
        <nav class="actions-grid">
            <a href="/message/{{ utilisateur.id }}" class="action-link primary">
                <span>💬</span>
                <span>Message</span>
            </a>
            <a href="/virement/{{ utilisateur.id }}" class="action-link">
                <span>💸</span>
                <span>Virement</span>
            </a>
            <a href="/historique/{{ utilisateur.id }}" class="action-link">
                <span>📜</span>
                <span>Historique</span>
            </a>
            <a href="/home" class="action-link full-width">
                <span>🏠</span>
                <span>Retour Accueil</span>
            </a>
        </nav>

        <!-- Section Informations utilisateur -->
        <section class="section-card">
            <h2 class="section-title">
                <span>ℹ️</span>
                <span>Informations utilisateur</span>
            </h2>
            <div class="info-list">
                <div class="info-item">
                    <span class="info-label">Nom</span>
                    <span class="info-value">{{ utilisateur.proprietaire }}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">ID</span>
                    <span class="info-value">{{ utilisateur.id }}</span>
                </div>
            </div>
        </section>

        <!-- Section Publications -->
        <section class="section-card">
            <h2 class="section-title">
                <span>📝</span>
                <span>Publications</span>
            </h2>
            <div class="empty-publications">
                Aucune publication pour le moment
            </div>
        </section>

    </div>

</body>
</html>
