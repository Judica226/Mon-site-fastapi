<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coris Bank - Dashboard</title>
    <style>
        :root {
            --bg-dark: #121212;
            --surface-dark: #1e1e1e;
            --surface-light: #2c2c2c;
            --coris-red: #c8102e;
            --coris-dark-red: #8b0000;
            --coris-gold: #f2a900;
            --active-blue: #0084ff;
            --text-primary: #ffffff;
            --text-secondary: #b0b3b8;
            --border-color: #333333;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            padding-top: 65px;
            padding-bottom: 30px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* En-tête fixe (Barre supérieure) */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: var(--surface-dark);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
            max-width: 480px;
            margin: 0 auto;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border-radius: 50%;
            text-decoration: none;
            transition: background-color 0.2s, color 0.2s;
        }

        .nav-btn.active {
            color: var(--active-blue);
            background-color: rgba(0, 132, 255, 0.1);
        }

        .nav-btn:active {
            background-color: var(--surface-light);
            color: var(--text-primary);
        }

        .menu-toggle {
            font-size: 1.5rem;
            color: var(--text-primary);
        }

        /* Message de bienvenue */
        .welcome-header {
            text-align: center;
            margin-top: 10px;
        }

        .welcome-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .welcome-header p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Carte bancaire Coris Bank */
        .credit-card {
            background: linear-gradient(135deg, var(--coris-red) 0%, var(--coris-dark-red) 100%);
            border-radius: 20px;
            padding: 22px;
            color: #ffffff;
            box-shadow: 0 10px 25px rgba(200, 16, 46, 0.25);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            aspect-ratio: 1.586 / 1;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .credit-card::before {
            content: "";
            position: absolute;
            top: -40%;
            right: -20%;
            width: 220px;
            height: 220px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            pointer-events: none;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1;
        }

        .bank-brand {
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: var(--coris-gold);
        }

        .chip {
            width: 42px;
            height: 30px;
            background: linear-gradient(135deg, #e0aa3e 0%, #f7d070 100%);
            border-radius: 6px;
        }

        .card-number {
            font-size: 1.25rem;
            letter-spacing: 3px;
            font-family: monospace;
            text-align: center;
            margin: 15px 0;
            z-index: 1;
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 1;
        }

        .card-holder {
            display: flex;
            flex-direction: column;
        }

        .card-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 1px;
        }

        .card-val {
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Overlay d'arrière-plan du menu */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 200;
        }

        .sidebar-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Menu latéral coulissant */
        .sidebar {
            position: fixed;
            top: 0;
            right: -280px;
            width: 280px;
            height: 100%;
            background-color: var(--surface-dark);
            border-left: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            z-index: 201;
            display: flex;
            flex-direction: column;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 24px 16px;
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .sidebar-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--coris-red);
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 12px;
            transition: background-color 0.2s;
        }

        .sidebar-link:active {
            background-color: var(--surface-light);
        }

        .sidebar-link.logout {
            color: var(--coris-red);
            margin-top: 20px;
            border-top: 1px solid var(--border-color);
            border-radius: 0;
            padding-top: 18px;
        }

        .link-icon {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Barre de navigation supérieure -->
    <header class="top-bar">
        <div class="nav-links">
            <a href="/home" class="nav-btn" title="Accueil">🏠</a>
            <a href="/messages" class="nav-btn" title="Messagerie">💬</a>
            <a href="/users" class="nav-btn" title="Utilisateurs">👥</a>
        </div>
        <button class="nav-btn menu-toggle" id="openMenu" title="Menu">☰</button>
    </header>

    <!-- Conteneur principal -->
    <div class="app-container">

        <!-- Message d'accueil -->
        <section class="welcome-header">
            <h1>Bienvenue {{ nom }}</h1>
            <p>Espace bancaire sécurisé</p>
        </section>

        <!-- Carte bancaire Coris Bank -->
        <div class="credit-card">
            <div class="card-top">
                <span class="bank-brand">CORIS BANK</span>
                <div class="chip"></div>
            </div>
            <div class="card-number">•••• •••• •••• 8842</div>
            <div class="card-bottom">
                <div class="card-holder">
                    <span class="card-label">Titulaire</span>
                    <span class="card-val">{{ nom }}</span>
                </div>
                <div class="card-holder">
                    <span class="card-label">Statut</span>
                    <span class="card-val">Compte Actif</span>
                </div>
            </div>
        </div>

    </div>

    <!-- Overlay d'arrière-plan -->
    <div class="sidebar-overlay" id="overlay"></div>

    <!-- Menu latéral (Drawer) -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">Menu principal</span>
            <button class="close-btn" id="closeMenu">&times;</button>
        </div>

        <nav class="sidebar-menu">
            <a href="/solde" class="sidebar-link">
                <span class="link-icon">💰</span>
                <span>Voir le solde</span>
            </a>
            <a href="/historique" class="sidebar-link">
                <span class="link-icon">📜</span>
                <span>Historique des transactions</span>
            </a>
            <a href="/virement" class="sidebar-link">
                <span class="link-icon">💸</span>
                <span>Effectuer un virement</span>
            </a>
            <a href="/profil" class="sidebar-link">
                <span class="link-icon">👤</span>
                <span>Profil</span>
            </a>
            <a href="/deconnexion" class="sidebar-link logout">
                <span class="link-icon">🚪</span>
                <span>Déconnexion</span>
            </a>
        </nav>
    </aside>

    <!-- JavaScript simple pour gérer l'ouverture/fermeture du menu -->
    <script>
        const openBtn = document.getElementById('openMenu');
        const closeBtn = document.getElementById('closeMenu');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        function toggleMenu() {
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        openBtn.addEventListener('click', toggleMenu);
        closeBtn.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);
    </script>

</body>
</html>
